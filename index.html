    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #iframe-container {
            flex: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botões flutuantes */
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .fab-main {
            width: 65px;
            height: 65px;
            background: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

        .fab-main img {
            width: 40px;
            height: 40px;
        }

        .fab-main:hover { transform: scale(1.1); }

        .fab-menu {
            position: absolute;
            bottom: 80px;
            right: 0;
            display: none;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .fab-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }

        .fab-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fab-item:hover { transform: scale(1.15); }

        .fab-container.active .fab-menu { 
            display: flex; 
            animation: fadeIn 0.4s; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .fab-main, .fab-item { width: 55px; height: 55px; }
            .fab-main img { width: 35px; height: 35px; }
        }
    </style>
</head>
<body>

    <div id="iframe-container">
        <iframe 
            src="https://app.feiticeira.vip/pr/c4WzxLeV" 
            title="Feiticeira VIP Plataforma"
            allow="accelerometer; autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; picture-in-picture; sync-xhr; usb; xr-spatial-tracking"
            allowfullscreen
            loading="lazy"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-pointer-lock"
        ></iframe>
    </div>

    <!-- Menu flutuante com imagens -->
    <div class="fab-container" role="region" aria-label="Menu rápido">
        <div class="fab-main" id="fab-toggle" tabindex="0" role="button" aria-label="Abrir menu">
            <img src="https://feiticeiravipbet.com.br/tiger.png" alt="Menu">
        </div>

        <div class="fab-menu">
            <a href="https://tigerclub.com.br/" target="_blank" class="fab-item" aria-label="Tiger Club">
                <img src="https://feiticeiravipbet.com.br/tiger.png" alt="Tiger Club">
            </a>
            <a href="https://bancabrasileirabet.com.br/" target="_blank" class="fab-item" aria-label="Banca Brasileira">
                <img src="https://feiticeiravipbet.com.br/bancabrasileira.png" alt="Banca Brasileira">
            </a>
            <a href="https://app.vaidarboa.com/pr/dnEq8Ahj" target="_blank" class="fab-item" aria-label="Vai Dar Boa">
                <img src="https://feiticeiravipbet.com.br/vaidarboa.png" alt="Vai Dar Boa">
            </a>
            <a href="https://wa.me/5583993370071?text=Suporte%2C%20preciso%20de%20ajuda%20na%20banca%20Feiticeira" 
               target="_blank" class="fab-item" aria-label="Suporte WhatsApp">
                <img src="https://feiticeiravipbet.com.br/suporte.png" alt="Suporte">
            </a>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('fab-toggle');
        const container = document.querySelector('.fab-container');

        toggle.addEventListener('click', () => {
            container.classList.toggle('active');
        });

        toggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                container.classList.toggle('active');
            }
        });

        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) {
                container.classList.remove('active');
            }
        });
    </script>
</body>
